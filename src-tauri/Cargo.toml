[package]
name = "es-ops"
version = "1.0.0"
description = "ES OPS - Otomatik Paylasim Sistemi"
authors = ["ES"]
edition = "2021"

[lib]
name = "es_ops_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Güvenli token deposu: Windows Credential Manager (keyring ile).
# keyring'in `v1` özelliği Windows'ta Windows Credential Manager'ı kullanır.
keyring = "4"

