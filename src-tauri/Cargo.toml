[package]
name = "es-ops"
version = "1.0.0"
description = "ES OPS - Otomatik Paylasim Sistemi"
authors = ["ES"]
edition = "2021"

[lib]
name = "es_ops_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Güvenli token deposu: Windows Credential Manager (keyring ile).
# keyring'in `v1` özelliği Windows'ta Windows Credential Manager'ı kullanır.
keyring = "4"
# Gerçek YouTube entegrasyonu için HTTP istemcisi.
# Yalnız bloklama istemcisi ve JSON kullanılır; bu projedeki tek HHTP istemci kütüphanesidir.
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
# Kriptografik olarak güvenli rastgele üretim (OAuth state + PKCE verifier).
rand = "0.8"
# PKCE S256 `code_challenge` için SHA-256.
sha2 = "0.10"
# URL-safe base64 (padsız) kodlama.
base64 = "0.22"
# HMAC-SHA1: X (Twitter) OAuth 1.0a imzalama. 
hmac = "0.12"
sha1 = "0.10"
# Kurumsal logo bindirme: gorsellere alt bolgeye logo isleme.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# ES Merkez Lisanslama uyumlu RSA-PSS imza dogrulamasi (lisans modulu).
rsa = "0.9"
# Lisans bitis tarihi karsilastirmasi (yerel tarih).
chrono = "0.4"
# UuidCreateSequential: ES Merkez ile birebir ayni stabil makine kodu uretimi.
# Win32_UI_WindowsAndMessaging: panic durumunda MessageBoxW ile kullaniciya
# Turkce hata gosterimi (logging.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Rpc", "Win32_UI_WindowsAndMessaging"] }

