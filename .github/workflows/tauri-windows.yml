name: "Tauri Windows Build"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Copy frontend files to frontend/ dir
        shell: pwsh
        run: .\scripts\copy-frontend.ps1

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli

      - name: Build Tauri (Windows)
        env:
          # Gerçek YouTube OAuth client id, yalnız build ortamına aktarılır.
          # Rust tarafında `option_env!` ile derleme anında uygulamaya gömülür.
          ES_OPS_YOUTUBE_CLIENT_ID: ${{ secrets.ES_OPS_YOUTUBE_CLIENT_ID }}
          # Gerçek Meta App ID (Facebook / Instagram ortak motoru için).
          # Yalnız derleme anında `option_env!` ile uygulamaya gömülür.
          # DİKKAT: App Secret asla gömülmez/aktarılmaz; Meta kod→token değişimi
          # secret gerektirdiğinden bağlantı `app_secret_required` durumunda kalır.
          ES_OPS_META_APP_ID: ${{ secrets.ES_OPS_META_APP_ID }}
        run: npx tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES-OPS-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
