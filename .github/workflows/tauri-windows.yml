name: "Tauri Windows Build"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Copy frontend files to frontend/ dir
        shell: pwsh
        run: .\scripts\copy-frontend.ps1

      - name: Run Rust unit tests (cargo test --lib)
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        # `machine_id_matches_es_merkez_on_this_pc`, gelistiricinin PC'sine
        # ozgu sabit bir makine kimligi dogrular; CI makinesinde anlamsizdir,
        # o yuzden yalnizca bu test atlanir.
        run: cargo test --lib -- --skip machine_id_matches_es_merkez_on_this_pc

      - name: Build Tauri release (MSI + NSIS)
        env:
          # GerÃ§ek YouTube OAuth client id, yalnÄ±z build ortamÄ±na aktarÄ±lÄ±r.
          # Rust tarafÄ±nda `option_env!` ile derleme anÄ±nda uygulamaya gÃ¶mÃ¼lÃ¼r.
          ES_OPS_YOUTUBE_CLIENT_ID: ${{ secrets.ES_OPS_YOUTUBE_CLIENT_ID }}
          # GerÃ§ek Meta App ID (Facebook / Instagram ortak motoru iÃ§in).
          # YalnÄ±z derleme anÄ±nda `option_env!` ile uygulamaya gÃ¶mÃ¼lÃ¼r.
          # DÄ°KKAT: App Secret asla gÃ¶mÃ¼lmez/aktarÄ±lmaz; Meta kodâ†’token deÄŸiÅŸimi
          # secret gerektirdiÄŸinden baÄŸlantÄ± `app_secret_required` durumunda kalÄ±r.
          ES_OPS_META_APP_ID: ${{ secrets.ES_OPS_META_APP_ID }}
        run: npx tauri build --bundles msi,nsis

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "src-tauri\target\release\bundle" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES-OPS-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES-OPS-Windows-Setup-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
