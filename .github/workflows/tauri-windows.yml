name: "Tauri Windows Build"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Copy frontend files to frontend/ dir
        shell: pwsh
        run: .\scripts\copy-frontend.ps1

      - name: Run Rust unit tests (cargo test --lib)
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        # `machine_id_matches_es_merkez_on_this_pc`, gelistiricinin PC'sine
        # ozgu sabit bir makine kimligi dogrular; CI makinesinde anlamsizdir,
        # o yuzden yalnizca bu test atlanir.
        run: cargo test --lib -- --skip machine_id_matches_es_merkez_on_this_pc

      - name: Build Tauri release (MSI + NSIS)
        env:
          # GerÃ§ek platform uygulama kimlikleri yalnÄ±z build ortamÄ±na aktarÄ±lÄ±r
          # ve Rust tarafÄ±nda `option_env!` ile derleme anÄ±nda EXE'ye gÃ¶mÃ¼lÃ¼r.
          # HiÃ§biri kaynak koduna, loglara ya da arayÃ¼ze yazÄ±lmaz.
          # YouTube / LinkedIn: Native PKCE, yalnÄ±z public Client ID gerekir.
          # YouTube web-app tipinde kullanÄ±lÄ±yorsa Client Secret de verilir.
          ES_OPS_YOUTUBE_CLIENT_ID: ${{ secrets.ES_OPS_YOUTUBE_CLIENT_ID }}
          ES_OPS_YOUTUBE_CLIENT_SECRET: ${{ secrets.ES_OPS_YOUTUBE_CLIENT_SECRET }}
          ES_OPS_LINKEDIN_CLIENT_ID: ${{ secrets.ES_OPS_LINKEDIN_CLIENT_ID }}
          # Meta (Facebook / Instagram ortak motoru) App ID + App Secret.
          ES_OPS_META_APP_ID: ${{ secrets.ES_OPS_META_APP_ID }}
          ES_OPS_META_APP_SECRET: ${{ secrets.ES_OPS_META_APP_SECRET }}
          # Facebook Login for Business Configuration ID (opsiyonel; paneldeki
          # konfigürasyon oluşturulunca gömülür, izinler panelden yönetilir).
          ES_OPS_META_CONFIG_ID: ${{ secrets.ES_OPS_META_CONFIG_ID }}
          # TikTok Authorization Code + Content Posting Client Key / Secret.
          ES_OPS_TIKTOK_CLIENT_KEY: ${{ secrets.ES_OPS_TIKTOK_CLIENT_KEY }}
          ES_OPS_TIKTOK_CLIENT_SECRET: ${{ secrets.ES_OPS_TIKTOK_CLIENT_SECRET }}
          # X (Twitter) OAuth 1.0a Consumer Key / Secret.
          ES_OPS_X_CONSUMER_KEY: ${{ secrets.ES_OPS_X_CONSUMER_KEY }}
          ES_OPS_X_CONSUMER_SECRET: ${{ secrets.ES_OPS_X_CONSUMER_SECRET }}
        run: npx tauri build --bundles msi,nsis

      - name: Sign MSI + NSIS (self-signed)
        shell: pwsh
        env:
          # Self-signed kod imzalama: ozel anahtar (pfx) yalniz CI ortamina
          # base64 olarak aktarilir; kaynak koduna/repoya asla yazilmaz.
          # Imza, SmartScreen/MotW engelini azaltir; Smart App Control'u asmaz
          # (test makineleri icin prepare-esops-test-machine.ps1 kullanilir).
          ES_OPS_CODE_SIGNING_PFX: ${{ secrets.ES_OPS_CODE_SIGNING_PFX }}
          ES_OPS_CODE_SIGNING_PASSWORD: ${{ secrets.ES_OPS_CODE_SIGNING_PASSWORD }}
        run: .\scripts\sign-bundle.ps1

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "src-tauri\target\release\bundle" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES-OPS-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES-OPS-Windows-Setup-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload signing cert (public)
        uses: actions/upload-artifact@v4
        with:
          name: ES-OPS-Signing-Cert
          path: certs/esops-cert.cer
          if-no-files-found: error
